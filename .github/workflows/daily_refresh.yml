name: Daily Runoff Analysis

on:
  schedule:
    # Runs every day at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:    # also allows manual trigger from the Actions tab

permissions:
  contents: write   # needed to commit the refreshed notebook back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute runoff_analysis.ipynb \
            --output runoff_analysis.ipynb \
            --ExecutePreprocessor.timeout=120

      - name: Commit refreshed notebook
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5  # v9.1.4
        with:
          message: "chore: daily notebook refresh [skip ci]"
          add: "runoff_analysis.ipynb"
          default_author: github_actions
